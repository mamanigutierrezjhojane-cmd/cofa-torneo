<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1 - Banner E-Sports</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

    <style>
        .banner {
            border: 3px dashed #7777aa;
            border-radius: 12px;
            padding: 100px 20px;
            background-color: #ffffff;
        }

        .titulo {
            color: #e6a03b;
        }

        .texto {
            color: #888888;
        }

        .boton {
            color: #1686b4;
            border: 2px solid #1686b4;
            padding: 10px 22px;
        }

        .boton:hover {
            background-color: #1686b4;
            color: white;
        }
    </style>
</head>

<body class="bg-light">

    <div class="container my-5 text-center">

        <div class="banner">

            <span class="badge bg-danger mb-3">
                GRAN FINAL 2026
            </span>

            <h1 class="display-3 text-uppercase fw-bold titulo mt-3">
                COFA TORNEO VALORANT
            </h1>

            <p class="lead fst-italic texto">
                Transmisión en vivo este sábado a las 20:00 hrs.
            </p>

            <a href="#" class="btn boton fw-bold mt-3">
                VER TRANSMISIÓN
            </a>

        </div>

    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

</body>
</html>
